<!DOCTYPE html>
<!-- NOTE: sudah dicek, aman -->
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Error — Tiket IRS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;500;600;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Space Grotesk', sans-serif; background-color: #f3f3f3; background-image: radial-gradient(#d1d1d1 1px, transparent 1px); background-size: 16px 16px; }
    .ticket-clip { position: relative; overflow: hidden; border-radius: 0; }
    .paper-hole { position: absolute; border-radius: 50%; z-index: 50; pointer-events: none; background: #f3f3f3; border: 4px solid #000; }
    .hole-left { width: 56px; height: 56px; left: -28px; top: 50%; transform: translateY(-50%); }
    .hole-right { width: 44px; height: 44px; right: -22px; top: 50%; transform: translateY(-50%); }
    .hole-top { width: 44px; height: 44px; left: calc(66.67% - 22px); top: -22px; }
    .hole-bottom { width: 44px; height: 44px; left: calc(66.67% - 22px); bottom: -22px; }
    @media (max-width: 767px) {
      .hole-left { left: -28px; top: 55%; transform: translateY(-50%); }
      .hole-right { right: -22px; top: 55%; transform: translateY(-50%); }
      .hole-top { left: calc(50% - 22px); top: -22px; }
      .hole-bottom { left: calc(50% - 22px); bottom: -22px; }
    }
  </style>
</head>
<body class="text-black min-h-screen flex flex-col">
  <header class="w-full border-b-4 border-black bg-white py-4 px-6 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="https://railfurs.my.id" class="text-xs font-bold uppercase tracking-widest text-black hover:opacity-75">← RAILFURS.MY.ID</a>
      <img src="https://i.ibb.co/VpzHz4sj/logo-bg-transparan.png" class="h-8 w-auto object-contain" alt="IRS Logo">
      <span class="text-[10px] font-bold uppercase tracking-wider bg-red-600 text-white px-2 py-1">ERROR</span>
    </div>
  </header>
  <main class="max-w-3xl w-full mx-auto px-4 py-12 flex-grow flex items-center justify-center">
    <div class="ticket-clip w-full">
      <div class="w-full bg-white border-4 border-black relative flex flex-col md:flex-row">
        <div class="paper-hole hole-left"></div>
        <div class="paper-hole hole-right"></div>
        <div class="paper-hole hole-top"></div>
        <div class="paper-hole hole-bottom"></div>
        <div class="flex-grow p-8 md:p-10 md:w-2/3 border-b-2 md:border-b-0 md:border-r-2 border-dashed border-black relative">
          <div class="flex justify-between items-center mb-6">
            <span class="text-[10px] font-bold uppercase tracking-[0.2em] bg-red-600 text-white px-3 py-1" id="error-code">ERROR</span>
            <span class="text-xs font-bold text-gray-500 font-mono">SYS-ERR // v1.0</span>
          </div>
          <h1 class="font-black uppercase tracking-tighter leading-none mb-6 text-3xl md:text-4xl" id="error-title" style="font-family: 'Inter', sans-serif;">Terjadi Kesalahan</h1>
          <p class="text-sm text-gray-600 mb-6" id="error-desc">Sistem tiket mengalami gangguan teknis. Silakan coba beberapa saat lagi.</p>
          <div class="border-2 border-black p-4 bg-gray-50 mb-6">
            <p class="text-[9px] uppercase tracking-wider text-gray-400 mb-1">Kode Error</p>
            <p class="text-xs font-mono font-bold" id="error-message">Unknown error occurred</p>
          </div>
          <div class="flex flex-col sm:flex-row gap-3">
            <button onclick="window.location.reload()" class="flex-1 bg-black text-white border-2 border-black py-3 text-xs font-bold uppercase tracking-widest hover:bg-gray-800 transition">Coba Lagi</button>
            <a href="/index.html" class="flex-1 bg-white text-black border-2 border-black py-3 text-xs font-bold uppercase tracking-widest text-center hover:bg-gray-100 transition">Kembali</a>
          </div>
        </div>
        <div class="w-full md:w-1/3 bg-gray-50 p-8 md:p-10 flex flex-col justify-center items-center text-center relative">
          <div class="w-16 h-16 border-4 border-black bg-red-100 flex items-center justify-center mb-4 text-3xl font-black">!</div>
          <p class="text-xs text-gray-500 uppercase tracking-wider">Butuh bantuan?</p>
          <a href="https://t.me/railfurs_admin1" target="_blank" class="mt-3 text-xs font-bold uppercase tracking-wider text-black underline hover:text-red-600">Hubungi Admin</a>
        </div>
      </div>
    </div>
  </main>
  <footer class="w-full border-t-4 border-black bg-white py-6 px-6">
    <div class="max-w-6xl mx-auto flex justify-between items-center gap-4">
      <p class="text-gray-400 text-[10px] uppercase tracking-widest">© 2025 Indonesian Railfurs</p>
      <a href="https://railfurs.my.id" class="text-[10px] uppercase tracking-widest text-gray-500 hover:text-black font-bold">WWW.RAILFURS.MY.ID</a>
    </div>
  </footer>
  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code') || '500';
      var msg = params.get('msg') || 'Terjadi kesalahan';
      var errors = {
        '400': { title: 'Permintaan Tidak Valid', desc: 'Data tidak dapat diproses oleh sistem.' },
        '401': { title: 'Tidak Terotorisasi', desc: 'Sesi kamu sudah berakhir.' },
        '403': { title: 'Akses Ditolak', desc: 'Kamu tidak memiliki izin untuk mengakses.' },
        '404': { title: 'Tidak Ditemukan', desc: 'Data tiket tidak ditemukan.' },
        '429': { title: 'Terlalu Banyak Permintaan', desc: 'Tunggu beberapa saat sebelum mencoba lagi.' },
        '500': { title: 'Kesalahan Server', desc: 'Server mengalami gangguan teknis.' },
        'timeout': { title: 'Waktu Habis', desc: 'Proses memakan waktu terlalu lama.' }
      };
      var e = errors[code] || { title: 'Terjadi Kesalahan', desc: 'Sistem tiket mengalami gangguan.' };
      document.getElementById('error-code').textContent = code;
      document.getElementById('error-title').textContent = e.title;
      document.getElementById('error-desc').textContent = e.desc;
      document.getElementById('error-message').textContent = msg;
    })();
  </script>
</body>
</html>
