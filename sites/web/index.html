    <style>
      #root{min-height:100vh}
      nav{position:fixed;top:0;left:0;right:0;z-index:50}
      /* Skip link: di luar layar sampai di-fokus */
      .skip-link{position:fixed;top:0;left:0;background:#000;color:#fff;padding:8px 16px;z-index:1000;text-decoration:none;font-weight:700;transform:translateY(-120%);transition:transform .2s}
      .skip-link:focus{transform:translateY(0)}
      /* Tinggi peta diatur React (240px di HP, 440px di desktop). Jangan

      .leaflet-container{min-height:240px}
      body{font-family:Inter,sans-serif;background-color:#fff;color:#000;overflow-x:hidden}
      html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}

      /* Preloader: tampil setelah 200ms, dan punya fallback CSS yang
         menyembunyikannya di detik ~4.2 kalau JS mati. */
      #rf-preloader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff;opacity:0;
        transition:opacity .55s cubic-bezier(.22,1,.36,1),visibility .55s;
        animation:rf-pre-in .3s ease .2s forwards,rf-pre-out .5s ease 4.2s forwards}
      #rf-preloader.rf-preloader--done{animation:none;opacity:0;visibility:hidden;pointer-events:none}
      .rf-preloader__inner{display:flex;flex-direction:column;align-items:center;gap:16px}
      .rf-preloader__word{font:900 clamp(1.5rem,4.6vw,2.4rem)/1 Inter,sans-serif;letter-spacing:.34em;text-indent:.34em;color:#000;text-transform:uppercase}
      .rf-preloader__bar{position:relative;display:block;width:min(210px,50vw);height:2px;background:#e8e8e8;overflow:hidden}
      .rf-preloader__bar::after{content:"";position:absolute;inset:0;background:#000;transform-origin:left;animation:rf-pre-bar 1.15s cubic-bezier(.65,.05,.36,1) infinite}
      @keyframes rf-pre-in{from{opacity:0}to{opacity:1}}
      @keyframes rf-pre-out{from{opacity:1}to{opacity:0;visibility:hidden}}
      @keyframes rf-pre-bar{0%{transform:scaleX(0) translateX(0)}50%{transform:scaleX(.7) translateX(0)}100%{transform:scaleX(1) translateX(0);opacity:0}}
      @media (prefers-reduced-motion:reduce){
        #rf-preloader{animation:rf-pre-in 0s 0s forwards}
        .rf-preloader__bar::after{animation:none;transform:scaleX(1)}
      }

        var path = window.location.pathname.toLowerCase().replace(/^\/+|\/+$/g, '').split('/')[0];
