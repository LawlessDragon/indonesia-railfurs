<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wiki Railfurs — Vol. 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow-x:hidden; }
  body { font-family:'Inter',sans-serif; background:#f2f0ea; color:#111; }

  .display { font-family:'Inter',sans-serif; font-weight:900; letter-spacing:-.03em; text-transform:uppercase; line-height:.88; }
  .outline { -webkit-text-stroke:1.5px #111; color:transparent; }
  .mono { font-family:'JetBrains Mono',monospace; }

  /* ── Moving dot grid, subtle ── */
  .grid-bg {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: radial-gradient(#00000010 1px, transparent 1px);
    background-size:26px 26px;
    animation: gridMove 16s linear infinite;
  }
  @keyframes gridMove { from{background-position:0 0;} to{background-position:0 260px;} }
  @media (prefers-reduced-motion: reduce) { .grid-bg{animation:none;} }

  .cover {
    position:relative; z-index:1; max-width:920px; margin:40px auto; background:#fff;
    border:3px solid #111; box-shadow:14px 14px 0 #111;
  }

  /* ── Masthead ── */
  .masthead {
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 28px; border-bottom:3px solid #111;
  }
  .mast-logo { font-size:15px; font-weight:900; letter-spacing:.02em; }
  .mast-right { display:flex; align-items:center; gap:14px; }
  .vol-tag {
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.1em;
    background:#111; color:#fff; padding:5px 12px;
  }
  .issue-date { font-family:'JetBrains Mono',monospace; font-size:10px; color:#999; letter-spacing:.05em; }

  /* ── Cover headline zone ── */
  .cover-head { padding:34px 28px 18px; text-align:center; border-bottom:1px dashed #ccc; }
  .cover-eyebrow { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.3em; text-transform:uppercase; color:#999; margin-bottom:14px; }
  .cover-eyebrow::before, .cover-eyebrow::after { content:'—'; margin:0 10px; opacity:.4; }
  h1 { font-size:clamp(34px,6vw,58px); margin-bottom:6px; }

  /* ── HERO: OC comic panel with interactive speech bubbles ── */
  .hero {
    position:relative; margin:24px 28px;
    background:#fff; border:2px solid #111; overflow:hidden;
    aspect-ratio:1 / 1;
  }
  .hero::before {
    content:'CHIT-CHAT'; position:absolute; top:10px; left:10px; z-index:5;
    font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.1em;
    background:#111; color:#fff; padding:3px 8px;
  }
  .hero-tag {
    position:absolute; top:10px; right:10px; z-index:5;
    font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.1em;
    background:#fff; color:#111; padding:3px 8px; border:1px solid #111;
  }
  .hero img {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    object-fit:cover; object-position:center;
    display:block;
  }

  /* ── Speech bubbles (comic style) ── */
  .bubble {
    position:absolute; z-index:4;
    background:#fff; border:2.5px solid #111;
    padding:14px 16px 12px;
    max-width:38%; min-width:180px;
    text-decoration:none; color:#111;
    box-shadow:6px 6px 0 #111;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
    opacity:0; transform: translateY(8px) scale(.95);
    cursor:pointer;
  }
  .bubble.show { opacity:1; transform: translateY(0) scale(1); }
  .bubble:hover {
    transform: translateY(-4px) scale(1.03) rotate(-1deg);
    box-shadow:10px 10px 0 #111;
    z-index:6;
  }
  .bubble-right:hover { transform: translateY(-4px) scale(1.03) rotate(1.2deg); }

  .bubble-left  { top:8%;  left:4%;  }
  .bubble-right { top:8%;  right:4%; }
  .bubble-row { display:contents; }

  /* bubble tail */
  .bubble::after {
    content:''; position:absolute;
    width:0; height:0; border-style:solid;
  }
  .bubble-left::after {
    bottom:-18px; left:32px;
    border-width:18px 14px 0 0;
    border-color: #111 transparent transparent transparent;
  }
  .bubble-left::before {
    content:''; position:absolute;
    bottom:-13px; left:34px;
    width:0; height:0; border-style:solid;
    border-width:13px 10px 0 0;
    border-color: #fff transparent transparent transparent;
    z-index:2;
  }
  .bubble-right::after {
    bottom:-18px; right:32px;
    border-width:18px 0 0 14px;
    border-color: #111 transparent transparent transparent;
  }
  .bubble-right::before {
    content:''; position:absolute;
    bottom:-13px; right:34px;
    width:0; height:0; border-style:solid;
    border-width:13px 0 0 10px;
    border-color: #fff transparent transparent transparent;
    z-index:2;
  }

  .bubble-who {
    font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700;
    letter-spacing:.15em; text-transform:uppercase;
    color:#fff; background:#111;
    display:inline-block; padding:2px 7px; margin-bottom:8px;
  }
  .bubble-right .bubble-who { background:#c85a1e; }
  .bubble-left  .bubble-who { background:#2f6fb0; }

  .bubble-text {
    display:block; font-size:14px; font-weight:600; line-height:1.4;
    color:#111; min-height:1.4em;
  }
  .bubble-cursor {
    display:inline-block; width:2px; height:1em; background:#111;
    vertical-align:-2px; margin-left:1px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity:0; } }

  .bubble-cta {
    display:flex; align-items:center; gap:6px; margin-top:10px;
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase;
    color:#111; opacity:0; transition: opacity .4s .2s;
  }
  .bubble.ready .bubble-cta { opacity:1; }
  .bubble-cta svg { transition: transform .25s; }
  .bubble:hover .bubble-cta svg { transform: translateX(4px); }
  .bubble-right .bubble-cta svg { transform: scaleX(-1); }
  .bubble-right:hover .bubble-cta svg { transform: scaleX(-1) translateX(4px); }

  /* replay — ikon kecil aja, nempel di pojok gambar, bukan baris terpisah */
  .replay {
    position:absolute; bottom:14px; left:14px; z-index:5;
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%;
    background:#fff; color:#111; border:2px solid #111; cursor:pointer;
    box-shadow:2px 2px 0 #111;
    transition: transform .15s, box-shadow .15s, opacity .4s;
    opacity:0; pointer-events:none;
  }
  .replay svg { width:14px; height:14px; }
  .replay.show { opacity:1; pointer-events:auto; }
  .replay:hover { transform: translateY(-2px) rotate(-15deg); box-shadow:3px 3px 0 #111; }
  .replay:active { transform: translateY(0) rotate(-15deg); box-shadow:1px 1px 0 #111; }

  /* artist credit — replaces old hint label */
  .hero-hint {
    position:absolute; bottom:14px; right:14px; z-index:5;
    font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700;
    letter-spacing:.12em; text-transform:uppercase; color:#666;
    background:#fff; padding:4px 8px; border:1px solid #111;
  }

  /* ── Cover lines (feature teasers, magazine style) ── */
  .cover-lines { padding:8px 28px 28px; }
  .stats-strip {
    display:grid; grid-template-columns:repeat(4,1fr); border-top:2px solid #111; border-bottom:2px solid #111;
    margin:24px 28px;
  }
  .stat-item {
    padding:18px 12px; text-align:center; border-right:1px dashed #ddd; display:flex; flex-direction:column; gap:4px;
  }
  .stat-item:last-child { border-right:none; }
  .stat-num { font-size:22px; font-weight:700; letter-spacing:-.01em; color:#111; }
  .stat-label { font-family:'JetBrains Mono',monospace; font-size:8.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#999; }
  .line-item {
    display:flex; align-items:center; gap:16px; padding:18px 0; border-bottom:1px solid #eee;
    text-decoration:none; color:#111; transition:.2s;
  }
  .line-item:last-child { border-bottom:none; }
  .line-num {
    font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; color:#ddd;
    flex-shrink:0; width:44px; transition:.2s;
  }
  .line-body { flex:1; }
  .line-title { font-size:19px; font-weight:900; text-transform:uppercase; letter-spacing:-.01em; margin-bottom:3px; }
  .line-desc { font-size:12px; color:#888; }
  .line-arrow { flex-shrink:0; transition:transform .25s; }
  .line-item:hover .line-num { color:#111; }
  .line-item:hover .line-arrow { transform:translateX(6px); }
  .line-item:hover .line-title { text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px; }
  .line-status {
    flex-shrink:0; font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    background:#f0f0f0; color:#999; padding:5px 10px; border:1px dashed #ccc;
  }

  /* ── Bottom strip: barcode-style footer ── */
  .cover-foot {
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 28px; border-top:3px solid #111; background:#111; color:#fff;
  }
  .barcode { display:flex; gap:1.5px; align-items:flex-end; height:26px; }
  .barcode span { display:block; width:2px; background:#fff; }
  .foot-label { font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.1em; opacity:.7; text-transform:uppercase; }

  @media(max-width:640px){
    .cover{margin:16px 10px; box-shadow:6px 6px 0 #111;}
    .masthead{padding:14px 16px; flex-wrap:wrap; gap:8px;}
    .mast-right{gap:8px;}
    .vol-tag{font-size:10px; padding:4px 8px;}
    .issue-date{font-size:9px;}
    .cover-head{padding:22px 16px 12px;}
    .cover-eyebrow{font-size:9px; letter-spacing:.2em; margin-bottom:10px;}
    .cover-eyebrow::before, .cover-eyebrow::after{margin:0 6px;}
    h1{font-size:clamp(28px,8.5vw,44px);}

    /* Hero jadi flex column: bubble row rapat di atas, gambar langsung nempel di bawahnya */
    .hero{
      margin:16px 16px 8px;
      display:flex;
      flex-direction:column;
      height:auto;
      aspect-ratio:auto;
      overflow:visible;
    }
    .hero::before{ top:8px; left:8px; font-size:8px; }
    .hero-tag{ top:8px; right:8px; font-size:8px; }

    .bubble-row{
      display:flex;
      gap:8px;
      padding:26px 10px 0;
      order:1;
    }
    .hero img{
      order:2;
      position:relative;
      width:100%;
      height:64vw;
      max-height:380px;
      min-height:240px;
      object-fit:cover;
      object-position:bottom center;
      top:auto; left:auto;
      display:block;
      margin-top:0;
    }
    .hero-hint{
      order:3;
      position:relative;
      align-self:flex-end;
      margin-top:4px;
      margin-right:4px;
      font-size:8px;
      padding:3px 6px;
      z-index:5;
    }

    /* Bubble: tetap kotak komik dengan ekor menunjuk ke karakter */
    .bubble, .bubble.show, .bubble.ready{
      position:relative;
      top:auto !important;
      left:auto !important;
      right:auto !important;
      flex:1;
      width:auto;
      max-width:100%;
      min-width:0;
      opacity:1;
      transform:none !important;
      box-shadow:4px 4px 0 #111;
      border-width:2px;
      padding:10px 12px 16px;
      margin-bottom:0;
    }
    .bubble:hover{box-shadow:6px 6px 0 #111; transform:none !important;}

    /* Ekor bubble tetap tampil, mengarah ke bawah (ke gambar) */
    .bubble-left::after   { bottom:-12px; left:20px; border-width:12px 9px 0 0; }
    .bubble-left::before  { bottom:-8px;  left:22px; border-width:8px 6px 0 0; }
    .bubble-right::after  { bottom:-12px; right:20px; border-width:12px 0 0 9px; }
    .bubble-right::before { bottom:-8px;  right:22px; border-width:8px 0 0 6px; }

    .bubble-text{font-size:12px; line-height:1.4;}
    .bubble-who{font-size:8px; padding:2px 5px; margin-bottom:6px; letter-spacing:.1em;}
    .bubble-cta{font-size:9px; margin-top:6px; gap:4px; opacity:1;}
    .bubble-cta svg{width:12px; height:12px;}

    .replay{width:26px; height:26px; bottom:10px; left:10px;}
    .replay svg{width:12px; height:12px;}
    .cover-lines{padding:4px 16px 18px;}
    .stats-strip{grid-template-columns:repeat(2,1fr); margin:16px 16px;}
    .stat-item{padding:12px 8px;}
    .stat-num{font-size:17px;}
    .stat-label{font-size:7.5px;}
    .line-num{font-size:20px; width:36px;}
    .line-title{font-size:15px;}
    .line-desc{font-size:11px;}
    .line-status{font-size:8px; padding:4px 8px;}
    .cover-foot{padding:14px 16px;}
    .barcode{height:20px;}
    .barcode span{width:1.5px;}
    .foot-label{font-size:8px;}
  }
  @media(max-width:380px){
    .bubble, .bubble.show, .bubble.ready{padding:8px 10px 7px;}
    .bubble-text{font-size:11px;}
    .bubble-who{font-size:7px;}
    h1{font-size:clamp(24px,9vw,36px);}
    .line-title{font-size:14px;}
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="cover">

  <div class="masthead">
    <span class="mast-logo display" style="font-size:16px;">RAILFURS WIKI</span>
    <div class="mast-right">
      <span class="issue-date mono">EDISI 2026</span>
      <span class="vol-tag">VOL. 01</span>
    </div>
  </div>

  <div class="cover-head">
    <p class="cover-eyebrow">Terbitan Perdana</p>
    <h1 class="display">Kenali<br><span class="outline">Dunia Furry</span></h1>
  </div>

  <!-- HERO: OC comic panel with interactive speech bubbles -->
  <div class="hero" id="hero">
    <span class="hero-tag mono">KLIK BUBBLE</span>

    <div class="bubble-row">
      <!-- Left character (brown canine) → Apa itu Furry? -->
      <a class="bubble bubble-left" href="apa-itu-furry.html" data-text="Eh, lo tau nggak sih furry itu sebenernya apa? Aku jelasin yuk!" id="bubble-left">
        <span class="bubble-who">ASEP MAHABARATA</span>
        <span class="bubble-text"><span class="bubble-text-inner"></span><span class="bubble-cursor"></span></span>
        <span class="bubble-cta">
          Baca: Apa itu Furry?
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </a>

      <!-- Right character (avian) → Event Furry -->
      <a class="bubble bubble-right" href="event-furry-indonesia.html" data-text="Belum tuh. Aku penasaran juga, yuk liat event-eventnya dulu!" id="bubble-right">
        <span class="bubble-who">UDIN PANCAROBA</span>
        <span class="bubble-text"><span class="bubble-text-inner"></span><span class="bubble-cursor"></span></span>
        <span class="bubble-cta">
          Lihat: Event Furry
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </a>
    </div>

    <img src="https://i.ibb.co.com/BKZhg6YW/Tak-berjudul2124-202607261229116.png" alt="Dua karakter furry sedang berbincang" />

    <button class="replay" id="replay" type="button" aria-label="Putar ulang percakapan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>

    <span class="hero-hint">Art by @thoyik</span>
  </div>

  <div class="stats-strip">
    <div class="stat-item">
      <span class="stat-num mono">04</span>
      <span class="stat-label">Furcon Terdokumentasi</span>
    </div>
    <div class="stat-item">
      <span class="stat-num mono">2018–26</span>
      <span class="stat-label">Rentang Waktu</span>
    </div>
    <div class="stat-item">
      <span class="stat-num mono">15+</span>
      <span class="stat-label">Edisi Tercatat</span>
    </div>
    <div class="stat-item">
      <span class="stat-num mono">3</span>
      <span class="stat-label">Furmeet Aktif</span>
    </div>
  </div>

  <div class="cover-foot">
    <div class="barcode" aria-hidden="true">
      <span style="height:100%;"></span><span style="height:60%;"></span><span style="height:90%;"></span><span style="height:40%;"></span>
      <span style="height:100%;"></span><span style="height:70%;"></span><span style="height:55%;"></span><span style="height:95%;"></span>
      <span style="height:45%;"></span><span style="height:100%;"></span><span style="height:65%;"></span><span style="height:80%;"></span>
      <span style="height:50%;"></span><span style="height:100%;"></span><span style="height:70%;"></span>
    </div>
    <span class="foot-label">Indonesian Railfurs</span>
  </div>

</div>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var left  = document.getElementById('bubble-left');
  var right = document.getElementById('bubble-right');
  var replay = document.getElementById('replay');
  var timers = [];

  function clearTimers(){
    timers.forEach(function(t){ clearTimeout(t); clearInterval(t); });
    timers = [];
  }

  function resetBubbles(){
    clearTimers();
    [left, right].forEach(function(b){
      b.classList.remove('show','ready');
      var inner = b.querySelector('.bubble-text-inner');
      var cur   = b.querySelector('.bubble-cursor');
      if (inner) inner.textContent = '';
      if (cur) cur.style.display = '';
    });
    replay.classList.remove('show');
  }

  function typeText(bubble, text, done){
    var inner = bubble.querySelector('.bubble-text-inner');
    var cur   = bubble.querySelector('.bubble-cursor');
    if (!inner) return done && done();
    if (reduce) {
      inner.textContent = text;
      if (cur) cur.style.display = 'none';
      return done && done();
    }
    var i = 0;
    var tick = function(){
      if (i >= text.length){
        if (cur) cur.style.display = 'none';
        clearInterval(timer);
        done && done();
        return;
      }
      inner.textContent += text.charAt(i);
      i++;
    };
    var timer = setInterval(tick, 28);
    timers.push(timer);
  }

  function playSequence(){
    resetBubbles();
    // left bubble appears first
    timers.push(setTimeout(function(){
      left.classList.add('show');
      timers.push(setTimeout(function(){
        typeText(left, left.getAttribute('data-text'), function(){
          // small pause, then right bubble
          timers.push(setTimeout(function(){
            right.classList.add('show');
            timers.push(setTimeout(function(){
              typeText(right, right.getAttribute('data-text'), function(){
                // mark both ready (show CTA), enable replay
                left.classList.add('ready');
                right.classList.add('ready');
                timers.push(setTimeout(function(){
                  replay.classList.add('show');
                }, 200));
              });
            }, 200));
          }, 350));
        });
      }, 150));
    }, 250));
  }

  replay.addEventListener('click', function(e){
    e.preventDefault();
    playSequence();
  });

  // Start the sequence on load
  if (document.readyState === 'complete') playSequence();
  else window.addEventListener('load', playSequence);

  // Auto redirect untuk path yang mirip/salah
  var redirectMap = {
    'furry': '/apa-itu-furry.html',
    'apaitufurry': '/apa-itu-furry.html',
    'event': '/event-furry-indonesia.html',
    'events': '/event-furry-indonesia.html',
    'furcon': '/event-furry-indonesia.html',
    'home': '/index.html',
    'main': '/index.html'
  };
  var path = window.location.pathname.toLowerCase().replace(/^\/+|\/+$/g, '').split('/')[0];
  if (redirectMap[path]) {
    window.location.replace(redirectMap[path]);
  }
})();
</script>

</body>
</html>
