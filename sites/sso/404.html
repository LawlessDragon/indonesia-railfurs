<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Halaman tidak ditemukan - Indonesian Railfurs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #0a0b0e; color: #e5e5e5;
    font: 15px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .kotak { max-width: 520px; text-align: center; }
  .kode { font-size: 64px; font-weight: 900; letter-spacing: -.04em; line-height: 1; color: #fb923c; }
  h1 { margin: 14px 0 8px; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; }
  p { margin: 0 0 26px; font-size: 13px; color: #a3a3a3; }
  a {
    display: inline-block; text-decoration: none; color: #fb923c;
    border: 1px solid #fb923c55; padding: 10px 18px; border-radius: 6px; font-size: 12px;
    transition: background .2s, border-color .2s;
  }
  a:hover { background: #fb923c1a; border-color: #fb923c; }
</style>
</head>
<body>
  <div class="kotak">
    <div class="kode">404</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang kamu buka tidak ada di sini.</p>
    <a href="/">Kembali ke halaman masuk</a>
  </div>
</body>
</html>
